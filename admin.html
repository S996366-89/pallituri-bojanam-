<!doctype html>
<html lang="te">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>అడ్మిన్ · పల్లెటూరు భోజనం</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="admin-wrap">

    <a href="index.html">← కస్టమర్ పేజీ</a>

    <h1>అడ్మిన్ ప్యానెల్</h1>

    <!-- LOGIN -->
    <section id="loginBox" class="order-card">

      <h2>అడ్మిన్ లాగిన్</h2>

      <input
        id="email"
        type="email"
        autocomplete="username"
        placeholder="Admin email"
      >

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Password"
      >

      <button id="loginBtn">
        లాగిన్
      </button>

      <p id="loginStatus" class="status"></p>

    </section>


    <!-- ADMIN PANEL -->
    <section id="panel" class="hidden">

      <div class="admin-head">

        <h2>మెనూ మార్చండి</h2>

        <button id="logoutBtn" class="secondary">
          లాగౌట్
        </button>

      </div>


      <!-- ADD MENU -->
      <form id="menuForm" class="order-card">

        <input
          id="itemName"
          required
          placeholder="కూర పేరు"
        >

        <input
          id="itemPrice"
          type="number"
          min="0"
          required
          placeholder="ధర"
        >

        <select id="itemCategory" required>
          <option value="">
            వర్గం ఎంచుకోండి
          </option>

          <option value="veg">
            🥬 Veg
          </option>

          <option value="nonveg">
            🍗 Non-Veg
          </option>
        </select>

        <button type="submit">
          మెనూలో చేర్చండి
        </button>

      </form>


      <!-- MENU LIST -->
      <details class="admin-menu-dropdown">

         <summary>
         🍛 ప్రస్తుత మెనూ
         <span class="admin-menu-arrow">▼</span>
         </summary>

       <div id="adminMenu"></div>

   </details>

       <!-- =========================
          MONTHLY PLAN ORDERS
        ========================= -->

<section class="admin-orders-section">

  <button
    type="button"
    id="monthlyOrdersToggle"
    class="admin-section-toggle"
  >
    🍱 నెలవారీ పథకం ఆర్డర్లు
    <span>▼</span>
  </button>

  <div
    id="monthlyOrdersPanel"
    class="admin-section-panel"
    style="display:none;"
  >

    <p class="admin-note">
      నెలవారీ పథకం తీసుకున్న కస్టమర్ల వివరాలు
    </p>

    <div
      id="monthlyOrdersCount"
      class="admin-orders-count"
    >
      మొత్తం: 0
    </div>

    <div
      id="monthlyOrders"
      class="orders admin-scroll-box"
    ></div>

  </div>

</section>

      <!-- =========================
           DAILY CURRY SELECTIONS
        ========================= -->

<section class="admin-orders-section">

  <button
    type="button"
    id="dailyCurryToggle"
    class="admin-section-toggle"
  >
    🍛 ఈరోజు కూరల ఎంపిక
    <span>▼</span>
  </button>

  <div
    id="dailyCurryPanel"
    class="admin-section-panel"
    style="display:none;"
  >

    <p class="admin-note">
      నెలవారీ పథకం కస్టమర్లు ఈరోజు ఎంచుకున్న కూరలు
    </p>

    <div
      id="dailyCurryCount"
      class="admin-orders-count"
    >
      మొత్తం: 0
    </div>

    <div
      id="dailyCurryOrders"
      class="orders admin-scroll-box"
    ></div>

  </div>

</section>


      <!-- =========================
           DAILY FOOD ORDERS
      ========================= -->

      <section class="admin-orders-section">

        <h2>🍛 రోజువారీ భోజన ఆర్డర్లు</h2>

        <p class="admin-note">
          ప్రతిరోజూ వచ్చిన భోజన ఆర్డర్లు
          తేదీ మరియు సమయంతో ఇక్కడ కనిపిస్తాయి.
        </p>

        <div
          id="orders"
          class="orders"
        ></div>

      </section>

    </section>

  </main>


  <script
    type="module"
    src="admin.js"
  ></script>

</body>
</html>
