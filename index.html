<!DOCTYPE html>
<html lang="te">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>పల్లెటూరు భోజనం</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header class="top">

    <img
      src="logo.png"
      alt="పల్లెటూరు భోజనం"
      class="logo"
    >

    <div class="brand-text">
      <h1>పల్లెటూరు భోజనం</h1>
      <p>ఇంటి రుచితో మీ మధ్యాహ్న భోజనం</p>
    </div>

    <a
      class="admin-link"
      href="admin.html"
    >
      అడ్మిన్
    </a>

  </header>


  <!-- =========================
       MAIN
  ========================= -->

  <main>

    <!-- Welcome -->

    <section class="hero">

      <h2>పల్లెటూరు భోజనానికి స్వాగతం</h2>

      <p>
        ప్రతిరోజూ ఇంటి రుచితో తయారుచేసిన
        రుచికరమైన మధ్యాహ్న భోజనం
        మీకు అందిస్తున్నాము.
      </p>

    </section>


    <!-- =========================
         TODAY MENU
    ========================= -->

    <section
      id="menu"
      class="menu-section"
    >

      <h2>ఈరోజు భోజనం</h2>

      <!-- Firebase menu items -->
      <div
        class="menu-grid"
        id="menuGrid"
      ></div>

    </section>


    <!-- =========================
         ORDER
    ========================= -->

    <section class="order-card">

      <h2>భోజనం ఆర్డర్ చేయండి</h2>

      <form id="orderForm">

        <label for="name">
          పేరు
        </label>

        <input
          id="name"
          type="text"
          required
          placeholder="మీ పేరు"
        >


        <label for="phone">
          ఫోన్ నంబర్
        </label>

        <input
          id="phone"
          type="tel"
          inputmode="tel"
          required
          placeholder="మీ ఫోన్ నంబర్"
        >


        <label for="address">
          చిరునామా
        </label>

        <textarea
          id="address"
          required
          placeholder="మీ చిరునామా"
        ></textarea>


        <label for="quantity">
          ఎన్ని భోజనాలు?
        </label>

        <input
          id="quantity"
          type="number"
          min="1"
          value="1"
          required
        >


        <button type="submit">
          ఆర్డర్ చేయండి
        </button>

      </form>


      <p
        id="orderStatus"
        class="status"
      ></p>

    </section>

  </main>


  <!-- =========================
       FOOTER
  ========================= -->

  <footer>

    <p>
      © పల్లెటూరు భోజనం • విజయవాడ
    </p>

  </footer>


  <script
    type="module"
    src="app.js"
  ></script>

</body>

</html>
